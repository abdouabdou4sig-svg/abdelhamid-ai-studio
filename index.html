<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABDELHAMID AI STUDIO | ALCHIMIE NUMÉRIQUE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                gold: '#D4AF37',
                purple: '#8B5CF6',
                violet: '#6D28D9',
                dark: '#020205'
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap');
      
      body {
        background-color: #020205;
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      .font-magic { font-family: 'Cinzel', serif; }

      #initial-loader {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, #1a0b2e 0%, #020205 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.8s ease-out;
      }

      .seal-container {
        position: relative;
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .magic-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2px solid #D4AF37;
        border-radius: 50%;
        border-top-color: transparent;
        animation: rotate 3s linear infinite;
      }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .loading-text {
        margin-top: 30px;
        font-family: 'Cinzel', serif;
        font-size: 12px;
        letter-spacing: 0.8em;
        color: #D4AF37;
        text-align: center;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.473.0?deps=react@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.33.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
    <script>
      // SÉCURITÉ ANTI-ÉCRAN NOIR : Si l'app ne charge pas, on enlève le loader quoi qu'il arrive
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          if (loader && loader.style.opacity !== '0') {
            console.warn("Démarrage lent détecté, retrait forcé du loader.");
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 800);
          }
        }, 4000);
      });
    </script>
  </head>
  <body>
    <div id="initial-loader">
      <div class="seal-container">
        <div class="magic-ring"></div>
        <div class="font-magic text-3xl text-brand-gold">A</div>
      </div>
      <p class="loading-text">ABDELHAMID<br/>AI STUDIO</p>
    </div>
    
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
