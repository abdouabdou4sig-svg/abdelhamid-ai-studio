<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABDELHAMID IA | STUDIO ALCHIMIE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                gold: '#D4AF37',
                purple: '#8B5CF6',
                violet: '#6D28D9',
                dark: '#020205'
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap');
      
      body {
        background-color: #020205;
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      .font-magic { font-family: 'Cinzel', serif; }

      #initial-loader {
        position: fixed;
        inset: 0;
        background: #020205;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }

      .logo-seal {
        position: relative;
        width: 120px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 2rem;
      }

      .ring {
        position: absolute;
        inset: 0;
        border: 2px solid #D4AF37;
        border-radius: 50%;
        border-top-color: transparent;
        animation: spin 2s linear infinite;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .alchemy-title {
        font-family: 'Cinzel', serif;
        font-size: 1.8rem;
        font-weight: 900;
        color: #D4AF37;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        text-align: center;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.473.0?deps=react@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.33.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
  </head>
  <body>
    <div id="initial-loader">
      <div class="logo-seal">
        <div class="ring"></div>
        <span class="font-magic text-5xl font-black text-brand-gold">IA</span>
      </div>
      <h1 class="alchemy-title">Abdelhamid</h1>
    </div>
    
    <div id="root"></div>

    <!-- Script de secours pour garantir l'affichage -->
    <script>
      window.hideAlchemyLoader = function() {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => {
            loader.remove();
            document.body.style.overflow = 'auto';
          }, 500);
        }
      };

      // Sécurité ultime : si après 5 secondes rien ne se passe, on force l'ouverture
      setTimeout(() => {
        if (document.getElementById('initial-loader')) {
          console.warn("Déblocage forcé du studio...");
          window.hideAlchemyLoader();
        }
      }, 5000);
    </script>

    <script type="module" src="index.tsx"></script>
  </body>
</html>
