<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABDELHAMID IA | STUDIO ALCHIMIE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: { gold: '#D4AF37', purple: '#8B5CF6', dark: '#020205' }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap');
      body { background-color: #020205; color: #ffffff; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overflow-x: hidden; }
      .font-magic { font-family: 'Cinzel', serif; }
      #initial-loader {
        position: fixed; inset: 0; background: #020205;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 9999; transition: opacity 0.8s ease;
      }
      .ring {
        width: 120px; height: 120px; border: 3px solid #D4AF37; border-radius: 50%;
        border-top-color: transparent; animation: spin 2s linear infinite;
      }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.473.0?deps=react@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.33.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
  </head>
  <body>
    <div id="initial-loader">
      <div class="ring"></div>
      <h1 class="font-magic text-brand-gold mt-8 tracking-[0.5em] text-2xl uppercase">Abdelhamid IA</h1>
    </div>
    <div id="root"></div>
    <script>
      window.hideAlchemyLoader = function() {
        const loader = document.getElementById('initial-loader');
        if (loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 800); }
      };
      setTimeout(window.hideAlchemyLoader, 4000); // Sécurité anti-écran noir
    </script>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
