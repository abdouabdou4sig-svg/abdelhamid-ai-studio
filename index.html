<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABDELHAMID AI STUDIO PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                red: '#e11d48',
                emerald: '#10b981',
                dark: '#000000'
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap');
      
      :root {
        --brand-red: #e11d48;
      }

      body {
        background-color: #000;
        color: #fff;
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        z-index: 10000;
        transition: opacity 0.5s ease-out, visibility 0.5s;
      }

      .spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(225, 29, 72, 0.1);
        border-top-color: var(--brand-red);
        border-radius: 50%;
        animation: spin 1s cubic-bezier(0.76, 0, 0.24, 1) infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .boot-text {
        font-size: 11px;
        letter-spacing: 0.6em;
        text-transform: uppercase;
        font-weight: 800;
        color: var(--brand-red);
        margin-top: 30px;
        text-align: center;
        opacity: 0.8;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.473.0",
    "@google/genai": "https://esm.sh/@google/genai@1.33.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
  </head>
  <body>
    <div id="loader">
      <div class="spinner"></div>
      <p class="boot-text" id="loader-msg">Abdelhamid Engine Booting</p>
    </div>

    <div id="root"></div>

    <script>
      window.releaseStudio = function() {
        const l = document.getElementById('loader');
        if (l) {
          l.style.opacity = '0';
          l.style.visibility = 'hidden';
          setTimeout(() => { if (l.parentNode) l.remove(); }, 500);
          console.log("Studio Abdelhamid : Prêt.");
        }
      };
      // Libération de secours si le JS échoue
      setTimeout(window.releaseStudio, 5000);
    </script>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
