<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abdelhamid AI Photography Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                red: '#ff0000',
                emerald: '#10b981',
                dark: '#0a0a0a'
              },
              accent: {
                DEFAULT: '#10b981',
                hover: '#059669'
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
      body {
        background-color: #050505;
        color: white;
        font-family: 'Inter', sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #050505;
        z-index: 1000;
        transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 2px solid rgba(255, 0, 0, 0.1);
        border-top: 2px solid #ff0000;
        border-radius: 50%;
        animation: spin 1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
  <body>
    <div id="loader">
      <div class="spinner"></div>
      <p id="loader-msg" style="margin-top: 24px; color: #ff0000; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; font-weight: 900; opacity: 0.8;">Réanimation du Studio...</p>
    </div>
    
    <div id="root"></div>

    <!-- PROTOCOLE DE MÉDICAMENT D'URGENCE -->
    <script>
      // Si après 3 secondes le loader est encore là, on force l'ouverture du studio
      // C'est notre "médicament" de secours pour que le studio se lève.
      window.forceStart = function() {
        var l = document.getElementById('loader');
        if (l) {
          console.log("Protocole de réanimation : Force l'affichage de l'interface.");
          l.style.opacity = '0';
          l.style.visibility = 'hidden';
          setTimeout(function() { if(l.parentNode) l.parentNode.removeChild(l); }, 1000);
        }
      };

      // On lance le compte à rebours de sécurité
      setTimeout(window.forceStart, 3500);

      // Monitoring des erreurs
      window.onerror = function(msg) {
        var m = document.getElementById('loader-msg');
        if (m) m.innerText = "Soin en cours... Lancement imminent";
        console.warn("Petit malaise détecté, le studio récupère :", msg);
      };
    </script>

    <script type="module" src="./index.tsx"></script>
  </body>
</html>
