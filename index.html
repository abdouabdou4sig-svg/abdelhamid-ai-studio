<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABDELHAMID AI STUDIO | ALCHIMIE NUMÉRIQUE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                gold: '#D4AF37',
                purple: '#8B5CF6',
                violet: '#6D28D9',
                dark: '#020205'
              }
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'glow': 'glow 2s ease-in-out infinite alternate',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              glow: {
                'from': { boxShadow: '0 0 10px #D4AF37, 0 0 20px #8B5CF6' },
                'to': { boxShadow: '0 0 20px #D4AF37, 0 0 40px #8B5CF6' }
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap');
      
      body {
        background-color: #020205;
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      .font-magic { font-family: 'Cinzel', serif; }

      #initial-loader {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, #1a0b2e 0%, #020205 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.8s ease-out;
      }

      .seal-container {
        position: relative;
        width: 150px;
        height: 150px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .magic-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2px solid #D4AF37;
        border-radius: 50%;
        border-top-color: transparent;
        animation: rotate 4s linear infinite;
      }

      .magic-ring-inner {
        position: absolute;
        width: 80%;
        height: 80%;
        border: 2px solid #8B5CF6;
        border-radius: 50%;
        border-bottom-color: transparent;
        animation: rotate 2s linear infinite reverse;
      }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .loading-text {
        margin-top: 40px;
        font-family: 'Cinzel', serif;
        font-size: 12px;
        letter-spacing: 1em;
        color: #D4AF37;
        text-align: center;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: #020205; }
      ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
    </style>
    <script>
      // Système de sécurité anti-blocage
      setTimeout(() => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 800);
        }
      }, 2000); // 2 secondes max pour le loader
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.473.0?deps=react@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.33.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
  </head>
  <body>
    <div id="initial-loader">
      <div class="seal-container">
        <div class="magic-ring"></div>
        <div class="magic-ring-inner"></div>
        <div class="font-magic text-2xl text-brand-gold">A</div>
      </div>
      <p class="loading-text">ABDELHAMID<br/>AI ALCHEMY</p>
    </div>
    
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
