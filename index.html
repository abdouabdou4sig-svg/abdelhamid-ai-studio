<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABDELHAMID AI STUDIO PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                red: '#e11d48',
                emerald: '#10b981',
                dark: '#000000'
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap');
      
      :root {
        --brand-red: #e11d48;
        --brand-emerald: #10b981;
      }

      body {
        background-color: #000;
        color: #fff;
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        z-index: 10000;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .scanner-line {
        position: absolute;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--brand-red), transparent);
        top: 0;
        animation: scan 3s linear infinite;
        opacity: 0.5;
      }

      @keyframes scan {
        0% { top: 0%; }
        100% { top: 100%; }
      }

      .pulse-ring {
        width: 100px;
        height: 100px;
        border: 1px solid var(--brand-red);
        border-radius: 50%;
        position: absolute;
        animation: ring-pulse 2s infinite;
      }

      @keyframes ring-pulse {
        0% { transform: scale(0.5); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: scale(1.5); opacity: 0; }
      }

      .boot-text {
        font-size: 10px;
        letter-spacing: 0.8em;
        text-transform: uppercase;
        font-weight: 800;
        color: var(--brand-red);
        margin-top: 40px;
        text-align: center;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.3.1",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body>
    <div id="loader">
      <div class="scanner-line"></div>
      <div class="pulse-ring"></div>
      <div style="width: 40px; height: 40px; border: 2px solid var(--brand-red); border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <p class="boot-text">Abdelhamid Studio Engine</p>
      
      <button id="emergency-wake" onclick="forceWake()" style="margin-top: 30px; padding: 10px 20px; border: 1px solid var(--brand-red); color: var(--brand-red); font-size: 10px; font-weight: 800; border-radius: 4px; cursor: pointer; display: none; background: transparent; transition: all 0.3s;">FORCER LE RÉVEIL</button>
    </div>

    <div id="root"></div>

    <script>
      // Fonction de réveil global
      function forceWake() {
        const l = document.getElementById('loader');
        if (l) {
          l.style.opacity = '0';
          setTimeout(() => {
            if (l.parentNode) l.remove();
          }, 600);
        }
      }

      window.wakeUp = forceWake;

      // Sécurité : Si après 4 secondes l'app ne s'est pas lancée, on débloque l'écran
      setTimeout(() => {
        const btn = document.getElementById('emergency-wake');
        if (btn) btn.style.display = 'block';
      }, 4000);

      // Réveil automatique de secours après 6 secondes
      setTimeout(forceWake, 6000);
    </script>

    <script type="module" src="./index.tsx"></script>
  </body>
</html>
