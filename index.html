<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABDELHAMID AI STUDIO PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                red: '#e11d48',
                emerald: '#10b981',
                dark: '#000000'
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap');
      
      :root {
        --brand-red: #e11d48;
      }

      body {
        background-color: #000;
        color: #fff;
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        z-index: 10000;
        transition: opacity 0.5s ease-out, visibility 0.5s;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(225, 29, 72, 0.1);
        border-top-color: var(--brand-red);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .boot-text {
        font-size: 10px;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        font-weight: 800;
        color: var(--brand-red);
        margin-top: 24px;
        text-align: center;
        opacity: 0.8;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body>
    <div id="loader">
      <div class="spinner"></div>
      <p class="boot-text" id="loader-msg">Initialisation Abdelhamid AI...</p>
    </div>

    <div id="root"></div>

    <script>
      // Fonction de déblocage global
      window.releaseStudio = function() {
        const loader = document.getElementById('loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
          console.log("Studio prêt et affiché.");
        }
      };

      // Sécurité : Libération automatique après 3 secondes si React met trop de temps
      setTimeout(window.releaseStudio, 3000);
    </script>

    <script type="module" src="./index.tsx"></script>
  </body>
</html>
