<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABDELHAMID AI STUDIO PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                red: '#e11d48',
                emerald: '#10b981',
                dark: '#050505'
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap');
      
      body {
        background-color: #050505;
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease-out;
      }

      .pulse-logo {
        width: 80px;
        height: 80px;
        background: #e11d48;
        border-radius: 24px;
        animation: pulse 1.5s infinite ease-in-out;
        box-shadow: 0 0 30px rgba(225, 29, 72, 0.4);
      }

      @keyframes pulse {
        0%, 100% { transform: scale(0.95); opacity: 0.6; }
        50% { transform: scale(1.05); opacity: 1; }
      }

      .loading-text {
        margin-top: 24px;
        font-size: 10px;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        color: #e11d48;
        font-weight: 800;
        text-align: center;
      }

      #error-console {
        position: fixed;
        bottom: 20px;
        left: 20px;
        right: 20px;
        background: rgba(225, 29, 72, 0.1);
        border: 1px solid rgba(225, 29, 72, 0.3);
        border-radius: 12px;
        padding: 15px;
        color: #e11d48;
        font-family: monospace;
        font-size: 11px;
        z-index: 10000;
        display: none;
        max-height: 150px;
        overflow-y: auto;
      }
    </style>
    <script>
      // Détecteur d'erreurs global
      window.addEventListener('error', function(e) {
        console.error("Erreur détectée:", e.message);
        const errCons = document.getElementById('error-console');
        if (errCons) {
          errCons.style.display = 'block';
          errCons.innerHTML += '<div>> ' + e.message + '</div>';
        }
      });

      // Secours : si l'app ne charge pas en 4s, on retire le loader pour voir ce qui se passe
      setTimeout(() => {
        const loader = document.getElementById('initial-loader');
        if (loader && loader.style.opacity !== '0') {
           console.warn("Retrait forcé du loader après timeout.");
           loader.style.opacity = '0';
           setTimeout(() => loader.remove(), 500);
        }
      }, 4000);
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.473.0?deps=react@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.33.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
  </head>
  <body>
    <div id="initial-loader">
      <div class="pulse-logo"></div>
      <p class="loading-text">ABDELHAMID<br/>ENGINE V3</p>
    </div>

    <div id="error-console"></div>
    <div id="root"></div>
    
    <script type="module" src="index.tsx"></script>
  </body>
</html>
