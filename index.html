<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABDELHAMID AI STUDIO PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                red: '#e11d48',
                emerald: '#10b981',
                dark: '#000000'
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap');
      
      :root {
        --brand-red: #e11d48;
        --brand-emerald: #10b981;
      }

      body {
        background-color: #000;
        color: #fff;
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1a0505 0%, #000 100%);
        z-index: 10000;
        transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
      }

      .scanner {
        width: 300px;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--brand-red), transparent);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: scan-move 2s ease-in-out infinite;
        box-shadow: 0 0 15px var(--brand-red);
      }

      @keyframes scan-move {
        0%, 100% { transform: translate(-50%, -150px); opacity: 0; }
        50% { transform: translate(-50%, 150px); opacity: 1; }
      }

      .orbit {
        width: 100px;
        height: 100px;
        border: 1px solid rgba(225, 29, 72, 0.2);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: rotate 4s linear infinite;
      }

      .orbit::after {
        content: '';
        position: absolute;
        top: -5px;
        width: 10px;
        height: 10px;
        background: var(--brand-red);
        border-radius: 50%;
        box-shadow: 0 0 10px var(--brand-red);
      }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .boot-status {
        margin-top: 40px;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.5em;
        color: var(--brand-red);
        text-transform: uppercase;
        text-align: center;
        animation: pulse-text 1.5s ease-in-out infinite;
      }

      @keyframes pulse-text {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; text-shadow: 0 0 8px rgba(225, 29, 72, 0.8); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body>
    <div id="loader">
      <div class="scanner"></div>
      <div class="orbit">
        <div style="width: 40px; height: 40px; border: 2px solid var(--brand-red); border-radius: 50%; opacity: 0.3;"></div>
      </div>
      <p class="boot-status" id="status-text">Initialisation des noyaux IA...</p>
    </div>

    <div id="root"></div>

    <script>
      // Système de libération forcée de l'interface
      window.releaseStudio = function() {
        const loader = document.getElementById('loader');
        if (loader) {
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
          document.body.style.overflow = 'auto';
          console.log("Studio débloqué avec succès.");
        }
      };

      // Sécurité : Si React met plus de 2.5s, on libère le visuel
      setTimeout(window.releaseStudio, 2500);

      // Mise à jour visuelle du status
      const statuses = ["Analyse des dépendances...", "Chargement du moteur VEO...", "Synchro Gemini 3 Pro...", "Prêt."];
      let currentIdx = 0;
      const interval = setInterval(() => {
        const el = document.getElementById('status-text');
        if (el && currentIdx < statuses.length) {
          el.innerText = statuses[currentIdx++];
        } else {
          clearInterval(interval);
        }
      }, 500);
    </script>

    <script type="module" src="./index.tsx"></script>
  </body>
</html>
