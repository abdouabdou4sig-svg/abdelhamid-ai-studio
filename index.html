<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABDELHAMID AI STUDIO PRO | MAGIE & TECH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                gold: '#D4AF37',
                purple: '#8B5CF6',
                violet: '#6D28D9',
                dark: '#020205'
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Plus+Jakarta+Sans:wght@200;400;600;800&display=swap');
      
      body {
        background-color: #020205;
        color: #ffffff;
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      h1, h2, .font-magic {
        font-family: 'Cinzel', serif;
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, #1a0b2e 0%, #020205 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .magic-seal {
        width: 120px;
        height: 120px;
        position: relative;
        border: 2px solid #D4AF37;
        transform: rotate(45deg);
        animation: seal-rotate 10s linear infinite;
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
      }

      .magic-seal::after {
        content: '';
        position: absolute;
        inset: 10px;
        border: 2px solid #8B5CF6;
        animation: seal-rotate 5s linear infinite reverse;
      }

      @keyframes seal-rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .loading-text {
        margin-top: 40px;
        font-family: 'Cinzel', serif;
        font-size: 14px;
        letter-spacing: 0.8em;
        text-transform: uppercase;
        color: #D4AF37;
        font-weight: 900;
        text-align: center;
        text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      }

      #error-console {
        position: fixed;
        top: 20px;
        left: 20px;
        right: 20px;
        background: rgba(109, 40, 217, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(212, 175, 55, 0.3);
        border-radius: 16px;
        padding: 20px;
        color: #D4AF37;
        font-family: monospace;
        font-size: 12px;
        z-index: 10000;
        display: none;
        max-height: 200px;
        overflow-y: auto;
      }
      
      /* Custom Scrollbar Magic */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #020205; }
      ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
    </style>
    <script>
      window.onerror = function(msg, url, line) {
        const console = document.getElementById('error-console');
        if (console) {
          console.style.display = 'block';
          console.innerHTML += '<div>[STUN] ' + msg + ' (Ligne: ' + line + ')</div>';
        }
      };
      
      // Sécurité : retrait forcé du loader après 3.5s
      setTimeout(() => {
        const loader = document.getElementById('initial-loader');
        if (loader && loader.style.opacity !== '0') {
           loader.style.opacity = '0';
           setTimeout(() => loader.remove(), 800);
        }
      }, 3500);
    </script>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "lucide-react": "https://esm.sh/lucide-react@0.473.0?deps=react@19.0.0",
    "@google/genai": "https://esm.sh/@google/genai@1.33.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
  </head>
  <body>
    <div id="initial-loader">
      <div class="magic-seal"></div>
      <p class="loading-text">ABDELHAMID<br/>AI ALCHEMY V3</p>
    </div>

    <div id="error-console">
      <h3 style="margin: 0 0 10px 0; border-bottom: 1px solid #D4AF37; font-family: 'Cinzel', serif;">TENTATIVE D'INVOCATION</h3>
    </div>
    
    <div id="root"></div>
    
    <script type="module" src="index.tsx"></script>
  </body>
</html>
