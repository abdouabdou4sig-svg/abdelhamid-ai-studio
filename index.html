<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABDELHAMID AI STUDIO PRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                red: '#e11d48',
                emerald: '#10b981',
                dark: '#000000'
              }
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap');
      
      :root {
        --brand-red: #e11d48;
        --brand-emerald: #10b981;
      }

      body {
        background-color: #000;
        color: #fff;
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        z-index: 10000;
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .scanner-line {
        position: absolute;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--brand-red), transparent);
        top: 0;
        animation: scan 2.5s ease-in-out infinite;
        opacity: 0.5;
      }

      @keyframes scan {
        0% { top: 0%; opacity: 0; }
        50% { opacity: 0.5; }
        100% { top: 100%; opacity: 0; }
      }

      .pulse-ring {
        width: 120px;
        height: 120px;
        border: 1px solid var(--brand-red);
        border-radius: 50%;
        position: absolute;
        animation: ring-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes ring-pulse {
        0% { transform: scale(0.8); opacity: 0; }
        50% { opacity: 0.3; }
        100% { transform: scale(1.4); opacity: 0; }
      }

      .boot-text {
        font-size: 10px;
        letter-spacing: 0.6em;
        text-transform: uppercase;
        font-weight: 800;
        color: var(--brand-red);
        margin-top: 50px;
        text-align: center;
        text-shadow: 0 0 10px rgba(225, 29, 72, 0.5);
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
  <body>
    <div id="loader">
      <div class="scanner-line"></div>
      <div class="pulse-ring"></div>
      <div style="width: 48px; height: 48px; border: 3px solid rgba(225, 29, 72, 0.1); border-top-color: var(--brand-red); border-radius: 50%; animation: spin 1s linear infinite;"></div>
      <p class="boot-text">Abdelhamid Core Engine Loading</p>
    </div>

    <div id="root"></div>

    <script>
      // Système de réveil forcé
      window.wakeUp = function() {
        const l = document.getElementById('loader');
        if (l) {
          l.style.opacity = '0';
          setTimeout(() => {
            if (l.parentNode) l.remove();
            document.body.style.overflow = 'auto';
          }, 600);
        }
      };

      // Sécurité anti-blocage : réveil après 2 secondes quoi qu'il arrive
      setTimeout(window.wakeUp, 2000);

      // Capture des erreurs fatales pour ne pas rester bloqué
      window.onerror = function() {
        console.warn("Échec du chargement standard, forçage de l'interface.");
        window.wakeUp();
      };
    </script>

    <script type="module" src="./index.tsx"></script>
  </body>
</html>
